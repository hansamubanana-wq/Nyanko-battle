<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>にゃんこ風大戦 - 究極個別設定版</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; color: #fff; margin: 0; padding: 0; text-align: center; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        #game-container { max-width: 800px; margin: 0 auto; background: #222; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.8); padding-bottom: 20px; }
        .page { display: none; padding: 15px; }
        .page.active { display: block; }
        .global-hud { display: flex; justify-content: space-around; background: #000; padding: 10px; font-size: 16px; font-weight: bold; border-bottom: 2px solid #444; }
        .gold-color { color: #ffeb3b; }
        .btn { background: #ff9800; border: none; color: white; padding: 14px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; touch-action: manipulation; }
        .btn:hover { background: #e68a00; }
        .btn:disabled { background: #555 !important; opacity: 0.4; cursor: not-allowed; }
        .btn-back { background: #555; width: 90%; max-width: 300px; margin-top: 20px; }
        #home-page h1 { font-size: 28px; margin-top: 40px; color: #ff9800; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 15px; padding: 30px; max-width: 400px; margin: 0 auto; }
        .btn-menu { font-size: 20px; padding: 22px; }
        canvas { background: linear-gradient(to bottom, #0d1b2a, #1b263b 70%, #3e493a 70%, #283618); border: 2px solid #444; border-radius: 6px; display: block; margin: 10px auto; max-width: 100%; }
        .battle-hud { display: flex; justify-content: space-between; background: #111; padding: 10px; font-size: 14px; border-radius: 4px; margin-bottom: 5px; font-weight: bold; }
        .deck-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; padding: 0 5px; }
        .deck-slot { background: #333; border: 2px solid #555; padding: 12px 4px; border-radius: 6px; font-size: 12px; cursor: pointer; text-align: center; font-weight: bold; min-height: 45px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .deck-slot.disabled { background: #222 !important; border-color: #333 !important; color: #555 !important; opacity: 0.4; pointer-events: none; }
        .scroll-list { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px; background: #111; border-radius: 6px; text-align: left; }
        .char-card { background: #2a2a2a; padding: 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .char-desc { font-size: 11px; color: #bbb; margin-top: 4px; line-height: 1.3; }
        .gacha-box { background: #333; border: 2px dashed #ffea00; padding: 20px; border-radius: 10px; margin: 20px auto; max-width: 400px; position: relative; }
        #gacha-log { background: #000; padding: 10px; border-radius: 6px; height: 100px; overflow-y: auto; font-size: 13px; color: #ccffcc; text-align: left; margin-top: 15px; }
        #gacha-animation-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); border-radius: 10px; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .capsule { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(to bottom, #ff1744 50%, #fff 50%); border: 4px solid #000; }
        @keyframes shake { 0% { transform: rotate(0deg); } 20% { transform: rotate(-10deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-5deg); } 80% { transform: rotate(5deg); } 100% { transform: rotate(0deg); } }
        .shake-anim { animation: shake 0.5s ease-in-out 3; }
        @keyframes popup { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1.2); opacity: 1; } }
        .result-popup { animation: popup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; font-size: 22px; font-weight: bold; }
        .rarity-基本 { border-left: 5px solid #ffffff; color: #fff; }
        .rarity-レア { border-left: 5px solid #00e5ff; color: #00e5ff; }
        .rarity-激レア { border-left: 5px solid #aa00ff; color: #aa00ff; }
        .rarity-超激レア { border-left: 5px solid #ffea00; color: #ffea00; text-shadow: 0 0 5px rgba(255,234,0,0.6); }
        .bg-基本 { background: #444; border-color: #666; }
        .bg-レア { background: #006064; border-color: #00e5ff; }
        .bg-激レア { background: #4a148c; border-color: #aa00ff; }
        .bg-超激レア { background: #f57f17; border-color: #ffea00; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="global-hud">
        <div>ステージ: <span id="global-stage">1</span></div>
        <div>所持金: <span id="global-gold" class="gold-color">500</span> G</div>
    </div>

    <!-- ホーム -->
    <div id="home-page" class="page active">
        <h1>にゃんこ風大戦<br><span style="font-size:16px; color:#aaa;">〜外部読み込みアニメーション対応〜</span></h1>
        <div class="menu-grid">
            <button class="btn btn-menu" style="background:#b71c1c;" onclick="showPage('battle-page')">⚔️ 戦闘開始</button>
            <button class="btn btn-menu" style="background:#1e88e5;" onclick="showPage('upgrade-page')">💪 キャラ育成</button>
            <button class="btn btn-menu" style="background:#4caf50;" onclick="showPage('gacha-page')">💎 ガチャを引く</button>
        </div>
    </div>

    <!-- バトル -->
    <div id="battle-page" class="page">
        <div class="battle-hud">
            <div>敵城: <span id="e-base-hp">600</span></div>
            <div>自城: <span id="p-base-hp">600</span> / 600</div>
            <div>コスト: <span id="battle-cost">0</span> / 500</div>
        </div>
        <canvas id="gameCanvas" width="750" height="200"></canvas>
        <div class="deck-grid" id="deck-grid"></div>
        <button class="btn btn-back" onclick="exitBattle()">🏳️ ホームへ戻る（撤退）</button>
    </div>

    <!-- 育成 -->
    <div id="upgrade-page" class="page">
        <h2>キャラクター育成・設定ライブラリ</h2>
        <div class="scroll-list" id="char-list-container"></div>
        <button class="btn btn-back" onclick="showPage('home-page')">↩️ ホームへ戻る</button>
    </div>

    <!-- ガチャ -->
    <div id="gacha-page" class="page">
        <h2>レアガチャの館</h2>
        <div class="gacha-box">
            <div id="gacha-animation-screen">
                <div id="gacha-capsule" class="capsule"></div>
                <div id="gacha-result-text" class="result-popup"></div>
                <button class="btn" id="btn-gacha-close" style="display:none; margin-top:20px;" onclick="closeGachaAnimation()">閉じる</button>
            </div>
            <b style="font-size:18px; color:#ffea00;">1回：150 G</b>
            <p style="font-size:12px; color:#ccc; margin:10px 0;">基本 50% | レア 35% | 激レア 12% | 超激レア 3%</p>
            <button class="btn" style="background:#4caf50; width:80%; font-size:18px;" id="btn-gacha" onclick="drawGacha()">ガチャを回す！</button>
        </div>
        <h3>ログ（獲得履歴）</h3>
        <div id="gacha-log"></div>
        <button class="btn btn-back" onclick="showPage('home-page')">↩️ ホームへ戻る</button>
    </div>
</div>

<!-- ここで外部ファイルから追加キャラクターを読み込む -->
<script src="characters.js"></script>

<script>
// characters.jsが読み込めなかった場合の保険データ
if (typeof CUSTOM_CHARACTERS === 'undefined') {
    alert("Error: characters.js が見つからないよ！同じフォルダに配置してね。");
}

let playerGold = 500;
let deployCost = 0;
let maxDeployCost = 500;
let currentStage = 1;
let gameActive = false;
let currentTab = 'home-page';
let tickCount = 0;

// 最初の1体だけ最初から所持させる
if(CUSTOM_CHARACTERS.length > 0 && CUSTOM_CHARACTERS[0].lv === 0) {
    CUSTOM_CHARACTERS[0].lv = 1;
}

let pBase = { x: 700, hp: 600, maxHp: 600 };
let eBase = { x: 50, hp: 600, maxHp: 600 };
let pUnits = [], eUnits = [];
let enemySpawnTimer = 0;

function getHp(c) { return c.bHp + (c.lv - 1) * Math.floor(c.bHp * 0.25); }
function getAtk(c) { return c.bAtk + (c.lv - 1) * Math.floor(c.bAtk * 0.2); }

function showPage(pageId) {
    currentTab = pageId;
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    if (pageId === 'battle-page') { initStage(); } else { gameActive = false; }
    if (pageId === 'upgrade-page') buildUpgradeList();
    updateUI();
}

function exitBattle() { gameActive = false; showPage('home-page'); }

function updateUI() {
    document.getElementById('global-gold').innerText = Math.floor(playerGold);
    document.getElementById('global-stage').innerText = currentStage;
    if (currentTab === 'battle-page') {
        document.getElementById('battle-cost').innerText = Math.floor(deployCost);
        document.getElementById('p-base-hp').innerText = Math.floor(pBase.hp);
        document.getElementById('e-base-hp').innerText = Math.floor(eBase.hp);
        updateBattleDeck();
    }
}

function buildUpgradeList() {
    const container = document.getElementById('char-list-container');
    container.innerHTML = '';
    CUSTOM_CHARACTERS.forEach(c => {
        if(!c.lv || c.lv === 0) return;
        let cost = c.lv * 40;
        let card = document.createElement('div');
        card.className = `char-card rarity-${c.rarity}`;
        card.innerHTML = `
            <div style="flex: 2;">
                <b>${c.name}</b> <span style="font-size:10px; border:1px solid; padding:1px 3px; border-radius:3px;">${c.rarity}</span><br>
                <span style="font-size:12px; font-weight:bold; color:#a2cf6e;">Lv.${c.lv} | HP:${getHp(c)} | ATK:${getAtk(c)} | 射程:${c.range}</span>
                <div class="char-desc">${c.description}</div>
            </div>
            <button class="btn" style="padding:8px 12px; font-size:13px; flex: 0 0 90px;" onclick="upgradeChar(${c.id})">${cost}G 強化</button>
        `;
        container.appendChild(card);
    });
}

function updateBattleDeck() {
    const grid = document.getElementById('deck-grid');
    grid.innerHTML = '';
    let unlocked = CUSTOM_CHARACTERS.filter(c => c.lv > 0).sort((a,b) => b.cost - a.cost);
    let displayCount = Math.min(10, unlocked.length);

    for(let i=0; i<10; i++) {
        let slot = document.createElement('div');
        if(i < displayCount) {
            let c = unlocked[i];
            slot.className = `deck-slot bg-${c.rarity}`;
            slot.innerHTML = `<span style="font-size:11px; max-height:28px; overflow:hidden;">${c.name}</span><span style="color:#ffeb3b; font-size:11px; margin-top:2px;">C:${c.cost}</span>`;
            
            if(deployCost < c.cost) {
                slot.classList.add('disabled');
            } else {
                const handler = (e) => { e.preventDefault(); spawnUnit(c.id); };
                slot.ontouchstart = handler;
                slot.onmousedown = handler;
            }
        } else {
            slot.className = 'deck-slot disabled';
            slot.innerHTML = `<span style="color:#666;">-</span>`;
        }
        grid.appendChild(slot);
    }
}

function drawGacha() {
    if (playerGold < 150) return;
    playerGold -= 150;
    updateUI();

    let rand = Math.random() * 100;
    let r = rand < 50 ? '基本' : rand < 85 ? 'レア' : rand < 97 ? '激レア' : '超激レア';
    let candidates = CUSTOM_CHARACTERS.filter(c => c.rarity === r);
    
    if(candidates.length === 0) candidates = CUSTOM_CHARACTERS; // フォールバック
    let rolled = candidates[Math.floor(Math.random() * candidates.length)];
    if(!rolled.lv) rolled.lv = 0;
    let isNew = rolled.lv === 0;
    rolled.lv++;

    const screen = document.getElementById('gacha-animation-screen');
    const capsule = document.getElementById('gacha-capsule');
    const resultTxt = document.getElementById('gacha-result-text');
    const closeBtn = document.getElementById('btn-gacha-close');
    
    screen.style.display = 'flex';
    capsule.style.display = 'block';
    capsule.className = 'capsule shake-anim';
    resultTxt.innerHTML = '';
    closeBtn.style.display = 'none';

    setTimeout(() => {
        capsule.style.display = 'none';
        resultTxt.className = `result-popup rarity-${rolled.rarity}`;
        resultTxt.innerHTML = `
            <span style="font-size:13px; color:#aaa;">${isNew?'🌟新規解放!!':'🔄能力重複向上'}</span><br>
            ${rolled.name}<br>
            <span style="font-size:15px; color:#fff;">(分類: ${rolled.rarity} / レベル.${rolled.lv})</span>
        `;
        closeBtn.style.display = 'block';

        let log = document.getElementById('gacha-log');
        log.innerHTML = `${isNew?'🌟【新】':'【重】'} ${rolled.name} (${rolled.rarity}) Lv.${rolled.lv}<br>` + log.innerHTML;
    }, 1500);
}

function closeGachaAnimation() {
    document.getElementById('gacha-animation-screen').style.display = 'none';
    updateUI();
}

function upgradeChar(id) {
    let c = CUSTOM_CHARACTERS.find(x => x.id === id);
    let cost = c.lv * 40;
    if(playerGold < cost) return;
    playerGold -= cost;
    c.lv++;
    buildUpgradeList();
    updateUI();
}

function spawnUnit(id) {
    if (!gameActive) return;
    let c = CUSTOM_CHARACTERS.find(x => x.id === id);
    if (!c || deployCost < c.cost) return;
    deployCost -= c.cost;
    
    pUnits.push({ 
        id: c.id, hp: getHp(c), maxHp: getHp(c), atk: getAtk(c), 
        speed: -c.speed, range: c.range, size: c.size, color: c.color,
        x: pBase.x - 20, cd: 0, state: 'walk', drawFunc: c.draw
    });
    updateUI();
}

function spawnEnemy() {
    let mul = 1 + (currentStage - 1) * 0.4;
    let isBoss = Math.random() < 0.15;
    
    eUnits.push({
        hp: Math.floor(40*mul*(isBoss?4:1)), maxHp: Math.floor(40*mul*(isBoss?4:1)),
        atk: Math.floor(6*mul*(isBoss?2:1)), speed: isBoss ? 0.7 : 1.2, range: isBoss ? 50 : 25,
        size: isBoss ? 35 : 20, reward: isBoss ? 120 : 30, x: eBase.x + 20, cd: 0,
        drawFunc: (ctx, x, y, size, tick, state) => {
            // 敵ユニットの簡易グラフィック
            ctx.fillStyle = isBoss ? '#ff1744' : '#ff8a80';
            ctx.fillRect(x - size/2, y - size, size, size);
            ctx.fillStyle = '#000';
            ctx.fillRect(x - size/4, y - size + 4, 3, 3);
        }
    });
}

function initStage() {
    pUnits = []; eUnits = [];
    pBase.hp = pBase.maxHp;
    eBase.hp = eBase.maxHp + (currentStage - 1) * 250;
    eBase.maxHp = eBase.hp;
    deployCost = 0;
    gameActive = true;
}

function victory() { gameActive = false; alert(`ステージ ${currentStage} クリア！ 300G獲得！`); playerGold += 300; currentStage++; showPage('home-page'); }
function gameOver() { gameActive = false; alert("敗北！キャラを育成して再挑戦だ！"); showPage('home-page'); }

function gameLoop() {
    tickCount++;
    if (gameActive) {
        if (deployCost < maxDeployCost) deployCost += 0.4;
        playerGold += 0.04;
        
        enemySpawnTimer++;
        if (enemySpawnTimer >= Math.max(40, 130 - currentStage * 10)) { spawnEnemy(); enemySpawnTimer = 0; }

        pUnits.forEach(p => {
            if(p.cd > 0) p.cd--;
            let target = eUnits.reduce((closest, e) => (e.x < p.x && (closest === null || e.x > closest.x)) ? e : closest, null);
            
            if (target && (p.x - target.x <= p.range)) { 
                p.state = 'attack';
                if(p.cd===0){ target.hp -= p.atk; p.cd=45; } 
            } else if (p.x - eBase.x <= p.range) { 
                p.state = 'attack';
                if(p.cd===0){ eBase.hp -= p.atk; p.cd=45; if(eBase.hp<=0) victory(); } 
            } else { 
                p.state = 'walk';
                if(!pUnits.some(o => o.x < p.x && p.x - o.x < p.size)) p.x += p.speed; 
            }
        });

        eUnits.forEach(e => {
            if(e.cd > 0) e.cd--;
            let target = pUnits.reduce((closest, p) => (p.x > e.x && (closest === null || p.x < closest.x)) ? p : closest, null);
            
            if (target && (target.x - e.x <= e.range)) { 
                if(e.cd===0){ target.hp -= e.atk; e.cd=45; } 
            } else if (pBase.x - e.x <= e.range) { 
                if(e.cd===0){ pBase.hp -= e.atk; e.cd=45; if(pBase.hp<=0) gameOver(); } 
            } else { 
                if(!eUnits.some(o => o.x > e.x && o.x - e.x < e.size)) e.x += e.speed; 
            }
        });

        pUnits = pUnits.filter(p => p.hp > 0);
        eUnits = eUnits.filter(e => { if(e.hp<=0){ playerGold += e.reward; return false; } return true; });

        // 描画
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#283618'; ctx.fillRect(0, 150, canvas.width, 50); // 地面
        
        // 拠点
        ctx.fillStyle = '#b71c1c'; ctx.fillRect(eBase.x - 15, 80, 30, 70); drawHpBar(eBase.x - 15, 70, 30, eBase.hp, eBase.maxHp);
        ctx.fillStyle = '#0d47a1'; ctx.fillRect(pBase.x - 15, 80, 30, 70); drawHpBar(pBase.x - 15, 70, 30, pBase.hp, pBase.maxHp);
        
        // 各種ユニットの描画（外部ファイルのdraw関数を呼び出す）
        pUnits.forEach(p => { 
            p.drawFunc(ctx, p.x, 150, p.size, tickCount, p.state); 
            drawHpBar(p.x - p.size/2, 142 - p.size, p.size, p.hp, p.maxHp); 
        });
        eUnits.forEach(e => { 
            e.drawFunc(ctx, e.x, 150, e.size, tickCount, 'walk'); 
            drawHpBar(e.x - e.size/2, 142 - e.size, e.size, e.hp, e.maxHp); 
        });
    }
    updateUI();
    requestAnimationFrame(gameLoop);
}

function drawHpBar(x, y, w, c, m) { ctx.fillStyle = '#333'; ctx.fillRect(x, y, w, 4); ctx.fillStyle = '#00e676'; ctx.fillRect(x, y, w * (Math.max(0, c) / m), 4); }

updateUI();
gameLoop();
</script>
</body>
</html>
